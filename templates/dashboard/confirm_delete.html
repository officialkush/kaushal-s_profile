{% extends 'dashboard/base_dashboard.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<div class="dash-topbar">
  <div><h1 class="dash-title">Delete Confirmation</h1></div>
</div>
<div class="dash-confirm-box">
  <i class="fas fa-triangle-exclamation"></i>
  <h3 style="font-family:var(--font-display);font-size:1.1rem;margin-bottom:0.8rem;">Are you sure?</h3>
  <p>You are about to permanently delete <strong style="color:var(--text);">{{ object }}</strong>. This action cannot be undone.</p>
  <form method="post" style="display:flex;gap:1rem;">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary" style="background:var(--accent-3);box-shadow:0 4px 20px rgba(255,77,141,0.3);">
      <i class="fas fa-trash"></i> Yes, Delete
    </button>
    <a href="{% url cancel_url %}" class="btn btn-ghost">Cancel</a>
  </form>
</div>
{% endblock %}
